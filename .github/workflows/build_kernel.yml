name: Build Kernel (KSUN + SUSFS)
# Maintainer: Yazdan Irfan

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '🚀 Make a release?'
        type: boolean
        required: true
        default: false
      telegram:
        description: '📢 Send to Telegram?'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

env:
  G_WORKSPACE: ${{ github.workspace }}
  G_EXT: ${{ github.workspace }}/external_deps

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Detect Kernel Directory
        run: |
          if [ -f "Kernel-6.6/Makefile" ]; then
            REAL_DIR="Kernel-6.6"
          elif [ -f "kernel-6.6/Makefile" ]; then
            REAL_DIR="kernel-6.6"
          else
            echo "Error: kernel-6.6 directory not found!"
            exit 1
          fi
          echo "G_KERNEL=${{ github.workspace }}/$REAL_DIR" >> $GITHUB_ENV
          rm -f kernel/kernel-6.6
          ln -sfn "../$REAL_DIR" kernel/kernel-6.6

      - name: Cleanup Ubuntu Environment
        run: |
          sudo apt-get remove --purge -y "php*" "dotnet*" "mysql*" "nodejs*" "clang*" "google*"
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/local
          mkdir -p ${{ env.G_EXT }}

      - name: Clone Required Dependencies
        working-directory: ${{ env.G_EXT }}
        run: |
          git clone https://github.com/WildKernels/AnyKernel3.git -b "gki-2.0"
          git clone https://github.com/xnnnsets/patch.git
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6

      - name: Inject KernelSU-Next Source
        run: |
          cd ${{ env.G_KERNEL }}
          
          # Setup KernelSU-Next into drivers/kernelsu
          curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          cd drivers/kernelsu
          KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          echo "KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.5")" >> $GITHUB_ENV
          echo "KSU_VERSION=$((30000 + KSU_GIT_VERSION))" >> $GITHUB_ENV

      - name: Apply SUSFS & KernelSU-Next Patches
        run: |
          cd ${{ env.G_KERNEL }}
          
          # 1. Copy core SUSFS headers and files into the kernel tree
          cp -r ${{ env.G_EXT }}/susfs4ksu/kernel_patches/include/linux/* include/linux/
          cp -r ${{ env.G_EXT }}/susfs4ksu/kernel_patches/fs/* fs/
          
          # 2. Patch kernel subsystems for SUSFS
          patch -p1 < ${{ env.G_EXT }}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch || true
          patch -p1 < ${{ env.G_EXT }}/patch/6.6/Dont_reduce_TTL.patch || true
          
          # 3. Patch KernelSU-Next for SUSFS support (auto-fallback across patch levels)
          if [ -d "${{ env.G_EXT }}/susfs4ksu/kernel_patches/KernelSU-Next" ]; then
            KSUN_PATCH=$(find ${{ env.G_EXT }}/susfs4ksu/kernel_patches/KernelSU-Next -name "*.patch" | head -n 1)
            patch -p2 -d drivers/kernelsu < "$KSUN_PATCH" || patch -p1 -d drivers/kernelsu < "$KSUN_PATCH" || true
          else
            KSU_PATCH=$(find ${{ env.G_EXT }}/susfs4ksu/kernel_patches/KernelSU -name "*10_enable_susfs_for_ksu.patch" | head -n 1)
            patch -p2 -d drivers/kernelsu < "$KSU_PATCH" || patch -p1 -d drivers/kernelsu < "$KSU_PATCH" || true
          fi
          
          # 4. Strict link and symbol fixes to prevent Kleaf build breakage
          sed -i '1s/^/#include <linux\/types.h>\n__attribute__((weak)) bool ksu_late_loaded = false;\n__attribute__((weak)) void ksu_lsm_hook_init(void) {}\n__attribute__((weak)) void ksu_lsm_hook_exit(void) {}\n/' drivers/kernelsu/core/init.c || true
          sed -i 's/ksu_syscall_hook_manager_init/ksu_syscall_hook_init/g' drivers/kernelsu/core/init.c || true
          sed -i 's/ksu_syscall_hook_manager_exit/ksu_syscall_hook_exit/g' drivers/kernelsu/core/init.c || true
          sed -i '/ksu_sulog_capture_sucompat/d' drivers/kernelsu/feature/sucompat.c || true
          sed -i '1s/^/struct user_arg_ptr;\n/' drivers/kernelsu/sulog/event.h || true

      - name: Patch Bazel Visibility & Build Constraints
        run: |
          cd ${{ env.G_KERNEL }}
          
          # Ensure drivers/kernelsu and fs/susfs are part of Bazel sandbox
          if [ -f "BUILD.bazel" ]; then
            sed -i '/"drivers\/\*\*"/a\        "drivers/kernelsu/**",\n        "fs/kernelsu/**",' BUILD.bazel 2>/dev/null || true
            sed -i '/"drivers\/md\/\*\*"/a\        "drivers/kernelsu/**",\n        "fs/kernelsu/**",' BUILD.bazel 2>/dev/null || true
          fi
          
          # Strip GKI protected export restrictions
          grep -rl "protected_exports_list" --include="BUILD.bazel" . 2>/dev/null | while read -r f; do
            sed -i '/"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\?/d' "$f"
          done
          find . -iname "abi_gki_protected_exports*" -delete 2>/dev/null || true
          
          # Disable fatal compilation warnings on KSU modules
          if [ -f "drivers/kernelsu/Makefile" ]; then
            echo "ccflags-y += -fno-lto" >> drivers/kernelsu/Makefile
            echo "ccflags-y += -fno-data-sections" >> drivers/kernelsu/Makefile
            echo "ccflags-y += -fno-function-sections" >> drivers/kernelsu/Makefile
            echo "ccflags-y += -Wno-error" >> drivers/kernelsu/Makefile
          fi

      - name: Force Compile KernelSU & SUSFS Configs
        run: |
          cd ${{ env.G_KERNEL }}
          
          # Guarantee driver entry compilation even if Kconfig evaluates late
          sed -i 's/obj-\$(CONFIG_KSU) += kernelsu\//obj-y += kernelsu\//g' drivers/Makefile || true
          sed -i '1s/^/ccflags-y += -DCONFIG_KSU=1\n/' drivers/kernelsu/Makefile || true
          
          cat << 'EOF' > ksu_fragment.config
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          EOF

          # Inject fragment into all arm64 config bases and workspace-level overlays
          find arch/arm64/configs -type f -exec sh -c 'cat ksu_fragment.config >> "$1"' _ {} \;
          find . -maxdepth 2 -type f \( -name "*defconfig*" -o -name "*overlay.config" -o -name "*fragment.config" \) -exec sh -c 'cat ksu_fragment.config >> "$1"' _ {} \;
          find ${{ env.G_WORKSPACE }}/kernel -type f \( -name "*defconfig*" -o -name "*overlay.config" -o -name "*fragment.config" \) -exec sh -c 'cat ksu_fragment.config >> "$1"' _ {} \; 2>/dev/null || true

      - name: Execute Bazel Build
        working-directory: ${{ env.G_WORKSPACE }}
        run: |
          KBUILD_FILE="${{ env.G_KERNEL }}/drivers/kernelsu/Kbuild"
          if [ -f "$KBUILD_FILE" ]; then
            sed -i "s/KSU_VERSION_FALLBACK := [0-9]\+/KSU_VERSION_FALLBACK := ${{ env.KSU_VERSION }}/" "$KBUILD_FILE"
            sed -i "s/KSU_VERSION_TAG_FALLBACK := .*/KSU_VERSION_TAG_FALLBACK := ${{ env.KSU_GIT_TAG }}/" "$KBUILD_FILE"
            sed -i "s/-DKSU_VERSION=[0-9]\+/-DKSU_VERSION=${{ env.KSU_VERSION }}/" "$KBUILD_FILE"
          fi
          
          # ThinLTO must remain disabled for reliable kprobe hooks on Android 15 GKI
          sed -i 's/export LTO="thin"/export LTO="none"/g' build_kernel.sh
          sed -i 's/--config=thinlto//g' build_kernel.sh
          
          chmod +x build_kernel.sh
          bash build_kernel.sh

      - name: Extract Artifacts & Package AnyKernel3
        working-directory: ${{ env.G_WORKSPACE }}
        run: |
          export OSRC_RELEASE="$(cat build_kernel.sh | grep SEC_BUILDNUMBER | tail -n 1 | sed 's/^export SEC_BUILDNUMBER\=\"//' | sed 's/\"$//' | sed 's/ogki//')"
          export VERSION="$(cat "${{ env.G_KERNEL }}/Makefile" | grep '^VERSION = ' | head -n 1 | sed 's/VERSION = //')"
          export PATCHLEVEL="$(cat "${{ env.G_KERNEL }}/Makefile" | grep '^PATCHLEVEL = ' | head -n 1 | sed 's/PATCHLEVEL = //')"
          export SUBLEVEL="$(cat "${{ env.G_KERNEL }}/Makefile" | grep '^SUBLEVEL = ' | head -n 1 | sed 's/SUBLEVEL = //')"
          export KERNEL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"
          export ASB_LEVEL="$(cat "${{ env.G_KERNEL }}/build.config.common" | grep ASB_SPL | tail -n 1 | sed 's/^ASB_SPL\=//')"
          export PKG_NAME="KSUN_SUSFS_a34x_${KERNEL_VERSION}_${ASB_LEVEL}_${OSRC_RELEASE}"
          echo "pkg_name=$PKG_NAME" >> $GITHUB_ENV

          cp out/target/product/a34x/obj/KLEAF_OBJ/dist/kernel_device_modules-6.6/mgk_64_k66_kernel_aarch64.user/Image ${{ env.G_EXT }}/AnyKernel3/Image
          cd ${{ env.G_EXT }}/AnyKernel3
          sed -i 's/device.name1=.*/device.name1=a34x/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a34xdd/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=a34xeea/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=a34/' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=SM-A346B/' anykernel.sh
          sed -i 's/device.name6=.*/device.name6=SM-A346E/' anykernel.sh
          sed -i 's/device.name7=.*/device.name7=SM-A346M/' anykernel.sh
          sed -i 's/device.name8=.*/device.name8=SM-A346N/' anykernel.sh
          sed -i 's/device.name9=.*/device.name9=SM-A3460/' anykernel.sh
          
          sed -i 's|block=.*|block=/dev/block/by-name/boot;|' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto;/' anykernel.sh
          
          ZIP_NAME="AnyKernel3_${PKG_NAME}.zip"
          zip -r9 "${{ env.G_WORKSPACE }}/$ZIP_NAME" * -x .git README.md *placeholder
          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload AnyKernel3 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-zip-KSUN-SUSFS
          path: "${{ env.zip_name }}"

      - name: Upload release assets
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.pkg_name }}"
          name: "KSUN + SUSFS - Kernel"
          files: ${{ env.zip_name }}

      - name: Telegram Notification
        if: github.event.inputs.telegram == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@"${{ env.zip_name }}" \
            -F caption="Build success — KSUN + SUSFS — ${{ github.sha }}" \
            -F parse_mode="Markdown"
