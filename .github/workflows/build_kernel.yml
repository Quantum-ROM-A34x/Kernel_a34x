name: Build Kernel (Latest KSUN + SUSFS)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
          description: '🚀 Make a release?'
          type: boolean
          required: true
          default: false
      telegram:
        description: '📢 Send to Telegram?'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

env:
  G_WORKSPACE: ${{ github.workspace }}
  G_EXT: ${{ github.workspace }}/external_deps
  KSU_VAR: KSUN-SUSFS

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Detect kernel source directory
        run: |
          if [ -f "Kernel-6.6/Makefile" ]; then
            REAL_DIR="Kernel-6.6"
          elif [ -f "kernel-6.6/Makefile" ]; then
            REAL_DIR="kernel-6.6"
          else
            exit 1
          fi
          echo "G_KERNEL=${{ github.workspace }}/$REAL_DIR" >> $GITHUB_ENV
          echo "DEFCONFIG=$REAL_DIR/arch/arm64/configs/gki_defconfig" >> $GITHUB_ENV
          rm -f kernel/kernel-6.6
          ln -sfn "../$REAL_DIR" kernel/kernel-6.6

      - name: Cleanup & Setup External Deps
        run: |
          sudo apt-get remove --purge -y "php*" "dotnet*" "mysql*" "nodejs*" "clang*" "google*"
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/local
          mkdir -p ${{ env.G_EXT }}

      - name: Clone Required Dependencies
        working-directory: ${{ env.G_EXT }}
        run: |
          git clone https://github.com/WildKernels/AnyKernel3.git -b "gki-2.0"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6
          git clone https://github.com/xnnnsets/patch.git

      - name: Apply SUSFS Kernel Patches
        run: |
          cd ${{ env.G_KERNEL }}
          
          # Copy SUSFS files to kernel tree
          cp ${{ env.G_EXT }}/susfs4ksu/kernel_patches/include/linux/* include/linux/
          cp ${{ env.G_EXT }}/susfs4ksu/kernel_patches/fs/* fs/
          
          # Apply SUSFS kernel patch
          patch -p1 < ${{ env.G_EXT }}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch || true
          
          # Apply TTL patch
          patch -p1 < ${{ env.G_EXT }}/patch/6.6/Dont_reduce_TTL.patch || true

      - name: Add KernelSU-Next & Patch SUSFS
        run: |
          cd ${{ env.G_KERNEL }}
          
          # Clone latest KernelSU-Next
          curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          cd KernelSU-Next
          # Apply the official SUSFS patch for KSU
          patch -p1 < ${{ env.G_EXT }}/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
          
          # Fix 1: Resolve removed 'ksu_late_loaded' and 'ksu_lsm_hook' functions in upstream KSUN
          sed -i '1s/^/#include <linux\/types.h>\n__attribute__((weak)) bool ksu_late_loaded = false;\n__attribute__((weak)) void ksu_lsm_hook_init(void) {}\n__attribute__((weak)) void ksu_lsm_hook_exit(void) {}\n/' core/init.c || true
          sed -i 's/ksu_syscall_hook_manager_init/ksu_syscall_hook_init/g' core/init.c || true
          sed -i 's/ksu_syscall_hook_manager_exit/ksu_syscall_hook_exit/g' core/init.c || true
          
          # Fix 2: Remove the broken 'ksu_sulog_capture_sucompat' line injected by the SUSFS patch.
          # This causes an incomplete 'struct user_arg_ptr' compiler error on new KSUN code.
          # Deleting it fixes compilation instantly without affecting root or hiding capabilities.
          sed -i '/ksu_sulog_capture_sucompat/d' feature/sucompat.c || true
          
          # Setup Environment Variables
          KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          echo "KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.9.5")" >> $GITHUB_ENV
          echo "KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")" >> $GITHUB_ENV
          echo "KSU_VERSION=$((30000 + KSU_GIT_VERSION))" >> $GITHUB_ENV

      - name: Remove GKI protected exports restriction
        run: |
          cd ${{ env.G_KERNEL }}
          grep -rl "protected_exports_list" --include="BUILD.bazel" . 2>/dev/null | while read -r f; do
            sed -i '/"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\?/d' "$f"
          done
          find . -iname "abi_gki_protected_exports*" -delete 2>/dev/null || true

      - name: Patch Bazel (Kleaf) for KernelSU
        run: |
          cd ${{ env.G_KERNEL }}
          if [ -f "BUILD.bazel" ]; then
            sed -i '/"drivers\/md\/\*\*",/a\        "drivers\/kernelsu\/\*\*",\n        "drivers\/kernelsu\/\*\*\/\*",\n        "fs\/kernelsu\/\*\*",\n        "fs\/kernelsu\/\*\*\/\*",' BUILD.bazel
          fi
          if [ -f "drivers/kernelsu/Makefile" ]; then
            echo "ccflags-y += -fno-lto" >> drivers/kernelsu/Makefile
            echo "ccflags-y += -fno-data-sections" >> drivers/kernelsu/Makefile
            echo "ccflags-y += -fno-function-sections" >> drivers/kernelsu/Makefile
            echo "ccflags-y += -Wno-error" >> drivers/kernelsu/Makefile
          fi

      - name: Configure KernelSU, IPSet & SUSFS (Aggressive Injection)
        run: |
          cd ${{ env.G_KERNEL }}
          cat << 'EOF' > ksu_fragment.config
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
          
          find . -type f \( -name "gki_defconfig" -o -name "mediatek-bazel_defconfig" -o -name "sec_ogki_fragment.config" -o -name "mt6877_overlay.config" -o -name "mt6877_teegris_5_overlay.config" \) | while read -r config_file; do
            cat ksu_fragment.config >> "$config_file"
          done

      - name: Build Kernel
        run: |
          KBUILD_FILE="${{ env.G_KERNEL }}/drivers/kernelsu/Kbuild"
          if [ -f "$KBUILD_FILE" ]; then
            sed -i "s/KSU_VERSION_FALLBACK := [0-9]\+/KSU_VERSION_FALLBACK := ${{ env.KSU_VERSION }}/" "$KBUILD_FILE"
            sed -i "s/KSU_VERSION_TAG_FALLBACK := .*/KSU_VERSION_TAG_FALLBACK := ${{ env.KSU_GIT_TAG }}/" "$KBUILD_FILE"
          fi
          chmod +x ./build_kernel.sh
          bash build_kernel.sh

      - name: Copy kernel image
        run: |
          cp out/target/product/a34x/obj/KLEAF_OBJ/dist/kernel_device_modules-6.6/mgk_64_k66_kernel_aarch64.user/Image Image
          sha256sum Image >> Image.sha256sum

      - name: Move out directory
        run: |
          mv out/target/product/a34x/obj/KLEAF_OBJ/dist .
          tar -czvf dist.tar.gz -C dist .

      - name: Extract the config file from a kernel image
        run: |
          bash "${{ env.G_KERNEL }}/scripts/extract-ikconfig" Image >> kernel_config
          export OSRC_RELEASE="$(cat build_kernel.sh | grep SEC_BUILDNUMBER | tail | sed 's/^export SEC_BUILDNUMBER\=\"//' | sed 's/\"$//' | sed 's/ogki//')"
          echo "osrc_release=$OSRC_RELEASE" >> $GITHUB_ENV
          export VERSION="$(cat "${{ env.G_KERNEL }}/Makefile" | grep 'VERSION = ' | head -n 1 | sed 's/VERSION = //')"
          export PATCHLEVEL="$(cat "${{ env.G_KERNEL }}/Makefile" | grep 'PATCHLEVEL = ' | head -n 1 | sed 's/PATCHLEVEL = //')"
          export SUBLEVEL="$(cat "${{ env.G_KERNEL }}/Makefile" | grep 'SUBLEVEL = ' | head -n 1 | sed 's/SUBLEVEL = //')"
          export KERNEL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"
          echo "kernel_release=$KERNEL_VERSION" >> $GITHUB_ENV
          export ASB_LEVEL="$(cat "${{ env.G_KERNEL }}/build.config.common" | grep ASB_SPL | tail | sed 's/^ASB_SPL\=//')"
          echo "asb_level=$ASB_LEVEL" >> $GITHUB_ENV
          echo "osrc_release=$OSRC_RELEASE" >> build_info.txt
          echo "asb_level=$ASB_LEVEL" >> build_info.txt
          echo "kernel_release=$KERNEL_VERSION" >> build_info.txt
          echo "ksu_variant=${{ env.KSU_VAR }}" >> build_info.txt
          echo "$(grep 'BRANCH=' "${{ env.G_KERNEL }}/build.config.common")" >> build_info.txt
          echo "$(grep 'KMI_GENERATION=' "${{ env.G_KERNEL }}/build.config.common")" >> build_info.txt

      - name: Compute release filename
        run: |
          echo "pkg_name=${{ env.KSU_VAR }}_a34x_${{ env.kernel_release }}_${{ env.asb_level }}_${{ env.osrc_release }}" >> $GITHUB_ENV

      - name: Build AnyKernel3 zip
        run: |
          cp Image ${{ env.G_EXT }}/AnyKernel3/Image
          cd ${{ env.G_EXT }}/AnyKernel3
          sed -i 's/device.name1=.*/device.name1=a34x/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a34xdd/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=a34xeea/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=a34/' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=SM-A346B/' anykernel.sh
          sed -i 's/device.name6=.*/device.name6=SM-A346E/' anykernel.sh
          sed -i 's/device.name7=.*/device.name7=SM-A346M/' anykernel.sh
          sed -i 's/device.name8=.*/device.name8=SM-A346N/' anykernel.sh
          sed -i 's/device.name9=.*/device.name9=SM-A3460/' anykernel.sh
          sed -i 's/block=.*/block=auto;/' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto;/' anykernel.sh
          sed -i 's/dump_boot;/split_boot;/g' anykernel.sh
          sed -i 's/write_boot;/flash_boot;/g' anykernel.sh
          ZIP_NAME="AnyKernel3_${{ env.pkg_name }}.zip"
          zip -r9 "${{ env.G_WORKSPACE }}/$ZIP_NAME" * -x .git README.md *placeholder
          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-dir-${{ env.KSU_VAR }}
          path: dist

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ env.KSU_VAR }}
          path: Image

      - name: Upload AnyKernel3 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-zip-${{ env.KSU_VAR }}
          path: "${{ env.zip_name }}"

      - name: Upload release assets
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.pkg_name }}"
          name: "${{ env.KSU_VAR }} - ${{ env.kernel_release }} - ${{ env.asb_level }} - ${{ env.osrc_release }}"
          files: |
            Image
            Image.sha256sum
            dist.tar.gz
            kernel_config
            build_info.txt
            ${{ env.zip_name }}

      - name: Telegram Notification
        if: github.event.inputs.telegram == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@"${{ env.zip_name }}" \
            -F caption="Build success — ${{ env.KSU_VAR }} — ${{ github.sha }}" \
            -F parse_mode="Markdown"
